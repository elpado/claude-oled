name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath \
              -ldflags "-X main.version=${VERSION}" -o "dist/$3" .
          }
          build windows amd64 claude-oled-windows-amd64.exe
          build windows arm64 claude-oled-windows-arm64.exe
          build darwin  arm64 claude-oled-macos-arm64
          build darwin  amd64 claude-oled-macos-amd64
          cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
